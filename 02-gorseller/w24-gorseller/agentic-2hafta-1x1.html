<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px; height: 1080px;
    background: linear-gradient(145deg, #0f0a1e 0%, #1a1033 55%, #2d1457 100%);
    font-family: 'Segoe UI', Arial, sans-serif;
    color: #fff; overflow: hidden; position: relative;
  }
  .glow {
    position: absolute; width: 700px; height: 700px; border-radius: 50%;
    background: radial-gradient(circle, #A855F733 0%, transparent 65%);
    top: -200px; right: -200px;
  }
  .container {
    position: relative; z-index: 2; height: 100%;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 90px 80px;
  }
  .badge {
    display: inline-block; align-self: flex-start;
    background: #A855F722; border: 2px solid #A855F7;
    color: #A855F7; font-size: 26px; font-weight: 700;
    padding: 12px 28px; border-radius: 999px; letter-spacing: 2px;
  }
  .hook {
    font-size: 60px; font-weight: 800; line-height: 1.22;
    margin: 40px 0 0 0;
  }
  .hook .vurgu { color: #A855F7; }
  .alt {
    font-size: 34px; line-height: 1.5; color: #c9c2dd; margin-top: 36px;
  }
  .footer {
    display: flex; justify-content: space-between; align-items: flex-end;
    border-top: 2px solid #ffffff22; padding-top: 36px;
  }
  .brand { font-size: 38px; font-weight: 800; }
  .brand span { color: #A855F7; }
  .cta {
    background: #F97316; color: #fff; font-size: 28px; font-weight: 700;
    padding: 18px 36px; border-radius: 14px;
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="container">
    <div>
      <div class="badge">AGENTIC SİSTEMLER</div>
      <div class="hook">Kendi AI agent'ınızı kurmak<br>ne kadar sürer?<br><span class="vurgu">Yanıt: 2 hafta.</span></div>
      <div class="alt">Raporlama, veri girişi, müşteri takibi — otonom ajanlarla.<br>7/24 çalışan, yorulmayan dijital çalışan.</div>
    </div>
    <div class="footer">
      <div class="brand">bot<span>fusions</span></div>
      <div class="cta">info@botfusions.com</div>
    </div>
  </div>
</body>
</html>
